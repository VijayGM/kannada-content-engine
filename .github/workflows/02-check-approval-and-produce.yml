name: 02 - Check Approval and Produce

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

        - name: Install system dependencies (ffmpeg + Kannada font)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-ui-core fonts-noto-core
          sudo fc-cache -f -v
          fc-list | grep -i kannada || echo "WARNING: Kannada font not found by fontconfig after install"

      - name: Install python dependencies
        run: pip install -r requirements.txt

      - name: Run production pipeline
        working-directory: scripts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SARVAM_API_KEY: ${{ secrets.SARVAM_API_KEY }}
          TTS_PROVIDER: ${{ vars.TTS_PROVIDER || 'sarvam' }}
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python produce.py
